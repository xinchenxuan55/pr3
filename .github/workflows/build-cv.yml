name: Build LaTeX CV

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build PDF and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

      - name: Upload PDF workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf-run-${{ github.run_number }}
          path: main.pdf

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --target main \
            --title "CV v${{ github.run_number }}" \
            --notes "Automated LaTeX CV build." \
            "./main.pdf"
